<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>overlay 位置精度テスト</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 40px;
        max-width: 720px;
      }
      .hint {
        color: #666;
        font-size: 13px;
        line-height: 1.6;
      }
      textarea {
        width: 480px;
        height: 160px;
        font-size: 16px;
        line-height: 1.7;
        padding: 12px;
        border: 2px solid #cccccc;
        box-sizing: border-box;
      }
      input {
        width: 480px;
        font-size: 16px;
        padding: 8px;
        margin-top: 28px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <h1>Overlay 位置精度テスト(モック校正)</h1>
    <p class="hint">
      「たべした / くたさい / 難しいでした / いたしす / させていただくます」に波線が正確に重なるか。<br />
      改行後・折り返し行・スクロール・リサイズでもズレないか。波線を hover/click → ツールチップ →
      「適用」でその範囲だけ置換されるか。
    </p>
    <textarea>
明日までにリンゴをたべした。資料を確認してくたさい。この問題はとても難しいでした。後ほどご連絡させていただくます。本日中に報告いたしす。
改行のあとの行でも、たべした が正しい位置に波線が出るか確認する。
折り返しテスト:あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんあいうえお。くたさい。</textarea
    >
    <input type="text" value="普通のテキスト入力。くたさい。" />
    <script src="./overlay-test.js"></script>
  </body>
</html>
